<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projekt Pixel</title>
<style>
  :root{--bg:#07050c;--fg:#e8e0f0;--hi:#ffd65a;--red:#c42a2a;--frame:#1a0f24}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  #tv{position:relative;width:min(100%, calc((100vh - 90px) * 16 / 9));aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;
    box-shadow:0 0 0 8px var(--frame),0 0 0 10px #3c2466,0 24px 70px #000;cursor:pointer}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  #scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
  #glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55) 100%)}
  #bar{width:min(100%, calc((100vh - 90px) * 16 / 9));display:flex;align-items:center;gap:8px}
  #bar button,#bar a{background:#1a0f24;color:var(--fg);border:2px solid #4b2a7b;border-radius:6px;width:40px;height:32px;display:grid;place-items:center;cursor:pointer;text-decoration:none;font-size:14px}
  #bar button:hover,#bar a:hover{border-color:var(--hi);color:var(--hi)}
  #ticks{flex:1;display:flex;gap:3px}
  #ticks div{flex:1;height:10px;background:#231733;border-radius:2px;cursor:pointer;overflow:hidden}
  #ticks div span{display:block;height:100%;width:0;background:linear-gradient(90deg,#c42a2a,#f5a02a)}
</style>
</head>
<body>
<div id="wrap">
  <div id="tv"><canvas id="c" width="320" height="180"></canvas><div id="scan"></div><div id="glow"></div></div>
  <div id="bar">
    <button id="prev" aria-label="Zurück">⏮</button>
    <button id="play" aria-label="Pause">⏸</button>
    <button id="next" aria-label="Weiter">⏭</button>
    <div id="ticks"></div>
    <a href="index.html" aria-label="Zum Tintenfilm" title="Zum Tintenfilm">✎</a>
  </div>
</div>

<script>
/* =========================================================
   Renderer: weich zeichnen auf 320×180, dann auf eine
   feste VGA-Palette quantisieren (mit leichtem Dithering)
   ========================================================= */
const W=320, H=180;
const out=document.getElementById('c').getContext('2d');
const buf=document.createElement('canvas'); buf.width=W; buf.height=H;
const bctx=buf.getContext('2d',{willReadFrequently:true});
let g=bctx;

const PAL_HEX=['#0d0814','#1a0f24','#231733','#2d1b4e','#3c2466','#4b2a7b','#6e3fa3','#9b6fd1','#c9a8f0',
 '#10183a','#1c2b5e','#34508f','#5a7fc4','#8fb4e8','#1f5b6b','#2f8f9d','#6fd0d0','#3a6b2a','#7bbf3a','#c8e86a',
 '#5a2410','#8a3a1a','#d66a1a','#f5a02a','#ffd65a','#ffe98a','#fff6e0','#7a1020','#c42a2a','#ff5a4a','#d86aa8',
 '#f2c79a','#e8b07a','#d99a6c','#a8663e','#5a3418','#8a5a2a','#ffe07a','#f5e0d0','#5a5670','#8d88a8','#cfc8b8',
 '#e8d8a0','#2a1a14','#ffffff'];
const PAL=PAL_HEX.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const LUT=new Uint8Array(32768).fill(255);
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v/16-.5)*18);
function nearest(r,gg,b){ let bi=0,bd=1e9; for(let i=0;i<PAL.length;i++){ const p=PAL[i], d=(p[0]-r)**2*.3+(p[1]-gg)**2*.59+(p[2]-b)**2*.11; if(d<bd){bd=d;bi=i;} } return bi; }
function present(){
  const im=bctx.getImageData(0,0,W,H), d=im.data;
  for(let y=0,i=0;y<H;y++) for(let x=0;x<W;x++,i+=4){
    const o=BAYER[((y&3)<<2)|(x&3)];
    const r=Math.max(0,Math.min(255,d[i]+o)), gg=Math.max(0,Math.min(255,d[i+1]+o)), b=Math.max(0,Math.min(255,d[i+2]+o));
    const k=(r>>3)<<10|(gg>>3)<<5|(b>>3); let p=LUT[k]; if(p===255) p=LUT[k]=nearest(r,gg,b);
    const c=PAL[p]; d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2]; d[i+3]=255;
  }
  out.putImageData(im,0,0);
}

/* ---------- Zeichen-Helfer ---------- */
const OL='#1a0f24';
let CS=1; const csStack=[];
const pcache={}; const P2=d=>pcache[d]||(pcache[d]=new Path2D(d));
function fillP(d,fill,lw=1,ol=OL){ const p=P2(d); if(fill){g.fillStyle=fill; g.fill(p);} if(lw){g.strokeStyle=ol; g.lineWidth=lw/CS; g.lineJoin='round'; g.stroke(p);} }
function E(x,y,rx,ry,fill,lw=1,rot=0,ol=OL){ g.beginPath(); g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,Math.PI*2); if(fill){g.fillStyle=fill; g.fill();} if(lw){g.strokeStyle=ol; g.lineWidth=lw/CS; g.stroke();} }
function line(pts,col,w){ g.beginPath(); g.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) g.lineTo(pts[i],pts[i+1]); g.strokeStyle=col; g.lineWidth=w; g.lineCap='round'; g.lineJoin='round'; g.stroke(); }
function withT(x,y,s,flip,fn){ g.save(); csStack.push(CS); CS*=s; g.translate(x,y); g.scale(flip?-s:s,s); fn(); g.restore(); CS=csStack.pop(); }
function limb(sx,sy,a1,a2,l1,l2,col,w){
  const ex=sx+Math.sin(a1)*l1, ey=sy+Math.cos(a1)*l1, hx=ex+Math.sin(a1+a2)*l2, hy=ey+Math.cos(a1+a2)*l2;
  line([sx,sy,ex,ey,hx,hy],OL,w+2/CS); line([sx,sy,ex,ey,hx,hy],col,w); return [hx,hy,a1+a2];
}
function leg(hx,hy,a,l1,l2,col,w,shoe,sl){ const f=limb(hx,hy,a[0],a[1],l1,l2,col,w); E(f[0]+sl*.45,f[1]+1,sl,w*.55+.6,shoe); return f; }
function walk(ph){ return [[Math.sin(ph)*.45, -Math.max(0,-Math.sin(ph))*.7],[Math.sin(ph+Math.PI)*.45, -Math.max(0,-Math.sin(ph+Math.PI))*.7]]; }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
function gun(x,y,ang,s=1){ withT(x,y,s,false,()=>{ g.rotate(ang);
  fillP('M-2 -3 L13 -3 L13 1 L3 1 L3 7 L-2 7Z','#5a5670',1); line([0,-2.2,12,-2.2],'#8d88a8',.8); }); }

/* =========================================================
   Figuren – eigene Entwürfe mit übertriebenen Proportionen
   ========================================================= */
// Der Erzähler: lang, dünn, Riesenaugen mit Augenringen, Hängenase, Unterhemd
function narrator(o={}){
  const skin='#f2c79a', aB=o.armB||[.12,.1], aF=o.armF||[-.08,-.12], L=o.legs||[[0,0],[0,0]], bob=o.bob||0;
  g.save(); g.translate(0,bob);
  const hb=limb(-9,-70,aB[0],aB[1],16,15,skin,3.2); E(hb[0],hb[1],2.6,3,skin,.8);
  leg(-4,-42,L[0],20,19,'#5a5670',4.4,'#2a1a14',5);
  leg(4,-42,L[1],20,19,'#5a5670',4.4,'#2a1a14',5);
  fillP('M-11 -73 Q-14 -56 -9 -40 L9 -40 Q14 -56 11 -73 Q0 -77 -11 -73Z','#fff6e0');
  if(!o.back){ E(3,-52,3,2,'#e8d8a0',0); fillP('M-6 -73 Q0 -66 6 -73',null,.8); }
  fillP('M-2.6 -74 L-2.6 -83 L2.6 -83 L2.6 -74Z',skin);
  if(o.back){
    E(0,-93,9.5,13,'#5a3418'); E(-9.5,-91,2,3.2,skin);
  } else {
    E(-8.5,-92,2,3.2,skin); E(1,-93,9,13,skin);
    const px=(o.pupil||[1,0])[0], py=(o.pupil||[1,0])[1];
    [[-2.5,-96],[5,-96.5]].forEach(([x,y])=>{ E(x,y,3.4,4.6,'#fff6e0',.8);
      if(o.blink){ E(x,y-1,3.5,3.8,skin,.8); } else E(x+px*1.4,y+py*1.6+.4,1.4,1.7,OL,0);
      g.beginPath(); g.arc(x,y+3.2,3,0.3,Math.PI-.3); g.strokeStyle='#9b6fd1'; g.lineWidth=.9/CS; g.stroke(); });
    line([-5.5,-102.5,-.5,-101.5],OL,1.1); line([2.5,-102,7.5,-102.8],OL,1.1);
    fillP('M3 -92 Q14 -90 10.5 -83.5 Q6.5 -81.5 3 -85.5Z',skin,0); fillP('M3 -92 Q14 -90 10.5 -83.5 Q6.5 -81.5 3 -85.5',null,.9);
    if(o.mouth==='o') E(0,-83.4,1.9,2.3,'#7a1020',.8);
    else if(o.mouth==='wince') line([-4,-83,-2,-84.5,0,-83,2,-84.5,4,-83],OL,1);
    else line([-4.5,-83.5,0,-84,3,-83.2],OL,1);
    if(o.wound){ E(7.5,-86,1.8,1.5,'#c42a2a',.6); }
    if(o.sweat) for(const s of o.sweat) fillP(`M${s[0]} ${s[1]-2.5} Q${s[0]+1.6} ${s[1]} ${s[0]} ${s[1]+1.2} Q${s[0]-1.6} ${s[1]} ${s[0]} ${s[1]-2.5}Z`,'#8fb4e8',.6);
  }
  fillP('M-10 -97 L-14 -106 L-7.5 -103.5 L-7 -112 L-1 -105.5 L3 -113 L5 -104.5 L11.5 -109 L10 -97 Q0 -103.5 -10 -97Z','#5a3418');
  const hf=limb(9,-70,aF[0],aF[1],16,15,skin,3.2);
  if(o.gun) gun(hf[0],hf[1],Math.PI/2-hf[2]);
  E(hf[0],hf[1],2.6,3,skin,.8);
  g.restore(); return hf;
}
// Der Andere: Keil-Oberkörper, Riesenkinn, blonde Stachelfrisur, rote Lederjacke, grelles Hemd
function tyler(o={}){
  const skin='#e8b07a', aB=o.armB||[.2,.2], aF=o.armF||[-.1,-.2], L=o.legs||[[0,0],[0,0]];
  const hb=limb(-21,-79,aB[0],aB[1],18,17,'#c42a2a',6); E(hb[0],hb[1],3.4,3.8,skin,.8);
  leg(-6,-46,L[0],22,21,'#2d1b4e',5.5,'#0d0814',6.5);
  leg(6,-46,L[1],22,21,'#2d1b4e',5.5,'#0d0814',6.5);
  fillP('M-26 -83 Q-31 -70 -13 -44 L13 -44 Q31 -70 26 -83 Q0 -91 -26 -83Z','#c42a2a');
  fillP('M-7 -86 L0 -58 L7 -86Z','#6fd0d0');
  [[-2,-80],[2,-74],[-1,-68],[1.5,-83]].forEach(([x,y])=>E(x,y,1,1,'#ffd65a',0));
  fillP('M-7 -86 L-13 -70 L-3 -64Z','#7a1020'); fillP('M7 -86 L13 -70 L3 -64Z','#7a1020');
  line([-20,-78,-14,-54],'#ff5a4a',1.2);
  fillP('M-5 -86 L-5 -93 L5 -93 L5 -86Z',skin);
  fillP('M-9 -113 Q-12 -97 -10 -90 Q-3 -84 1 -84 Q10 -84 13 -90 Q14 -101 11 -113 Q1 -117 -9 -113Z',skin);
  E(-9.5,-102,2,3,skin,.8);
  const px=(o.pupil||[-1,0])[0];
  [[-2,-104],[6,-104.5]].forEach(([x,y])=>{ E(x,y,2.8,1.6,'#fff6e0',.7); E(x+px,y,1,1.1,OL,0); line([x-3,y-1.6,x+3,y-1.4],OL,1.2); });
  line([-5,-109,1,-107.5],OL,1.3); line([4,-107.5,9,-109.5],OL,1.3);
  line([3,-103,5,-97,2.5,-96],'#a8663e',.9);
  if(o.talk) fillP('M-4 -93 Q3 -85 10 -93 Q3 -90 -4 -93Z','#7a1020',.9);
  else { fillP('M-5 -94 Q3 -87 11 -95 Q3 -92 -5 -94Z','#fff6e0',.9); line([0,-93,0.5,-91],OL,.5); line([4,-93,4.3,-91],OL,.5); line([8,-94,8,-92],OL,.5); }
  fillP('M-10 -111 L-15 -123 L-8.5 -118 L-7 -130 L-1.5 -120 L3 -132 L5.5 -120 L11 -128 L10.5 -117 L15 -121 L11.5 -109 Q0 -115 -10 -111Z','#ffe07a');
  const hf=limb(21,-79,aF[0],aF[1],18,17,'#c42a2a',6); E(hf[0],hf[1],3.4,3.8,skin,.8);
}
// Marla: knochig, Wuschelmähne, dunkle Augenschatten, Zigarette
function marla(o={}){
  const skin='#f5e0d0', aB=o.armB||[.15,.1], aF=o.armF||[-.1,-.1], L=o.legs||[[0,0],[0,0]];
  [[-10,-92,9],[10,-92,9],[0,-99,11],[-12,-80,7],[12,-80,7],[-6,-104,6],[7,-104,6]].forEach(([x,y,r])=>E(x,y,r,r,'#231733',1));
  const hb=limb(-8,-66,aB[0],aB[1],14,13,skin,2.4); E(hb[0],hb[1],2,2.3,skin,.7);
  leg(-3,-36,L[0],17,17,'#3c2466',2.8,'#0d0814',4);
  leg(3,-36,L[1],17,17,'#3c2466',2.8,'#0d0814',4);
  fillP('M-9 -68 Q-15 -50 -14 -33 Q0 -30 14 -33 Q15 -50 9 -68 Q0 -72 -9 -68Z','#4b2a7b');
  fillP('M-10 -69 Q0 -63 10 -69 Q6 -73 0 -71 Q-6 -73 -10 -69Z','#9b6fd1',.8);
  fillP('M-2 -70 L-2 -76 L2 -76 L2 -70Z',skin);
  if(o.back){ E(0,-86,9,11,'#231733'); }
  else {
    E(0,-85,7.5,10,skin);
    [[-3,-87],[3.5,-87.3]].forEach(([x,y])=>{ E(x,y,3.3,3.7,'#6e3fa3',0); E(x,y+.4,2.3,2.8,'#fff6e0',.7); E(x+(o.pupil||[0,0])[0],y+.8,1.1,1.3,OL,0); });
    E(.5,-78.8,2.1,1,'#c42a2a',.6);
    if(o.cig!==false){ line([2.5,-78.6,10,-77.6],'#fff6e0',1.1); E(10.3,-77.6,.8,.8,'#f5a02a',0); }
  }
  fillP('M-8 -91 Q-4 -97 0 -93 Q4 -98 9 -91 Q6 -99 0 -99 Q-6 -99 -8 -91Z','#231733');
  const hf=limb(8,-66,aF[0],aF[1],14,13,skin,2.4); E(hf[0],hf[1],2,2.3,skin,.7);
}
// Die Anhänger: kahl, schwarz gekleidet, alle gleich, ausdruckslos
function monkey(o={}){
  const skin='#e8b07a', L=o.legs||[[0,0],[0,0]], aB=o.armB||[.1,0], aF=o.armF||[-.1,0];
  const hb=limb(-10,-69,aB[0],aB[1],15,14,'#231733',3.4); E(hb[0],hb[1],2.5,2.8,skin,.7);
  leg(-4,-41,L[0],20,19,'#231733',4.4,'#0d0814',5);
  leg(4,-41,L[1],20,19,'#231733',4.4,'#0d0814',5);
  fillP('M-11 -71 Q-13 -55 -10 -40 L10 -40 Q13 -55 11 -71 Q0 -75 -11 -71Z','#231733');
  fillP('M-2.5 -72 L-2.5 -76 L2.5 -76 L2.5 -72Z',skin);
  E(0,-84,8.5,9.5,skin); E(-3,-89,2.4,1.3,'#fff6e0',0);
  E(-2.5,-84,1,1.1,OL,0); E(3.5,-84,1,1.1,OL,0); line([-2,-79,3,-79],OL,.9);
  if(o.hands){ /* Hände hoch */ }
  const hf=limb(10,-69,aF[0],aF[1],15,14,'#231733',3.4); E(hf[0],hf[1],2.5,2.8,skin,.7);
}

/* =========================================================
   Kulissen
   ========================================================= */
function makeCity(seed,x0,x1,base,minH,maxH,cols){
  const R=rng(seed), b=[]; let x=x0;
  while(x<x1){ const w=14+Math.floor(R()*20), h=minH+R()*(maxH-minH), lean=(R()-.5)*10, win=[];
    for(let yy=6;yy<h-5;yy+=6) for(let xx=3;xx<w-4;xx+=4.5) win.push([xx,yy,R()<.5]);
    b.push({x,w,h,lean,win,roof:Math.floor(R()*3),col:cols[Math.floor(R()*cols.length)],target:R()<.6,delay:R()*3.2,dir:R()<.5?-1:1});
    x+=w+R()*4; }
  return {b,base};
}
const winFar=makeCity(7,20,310,128,40,85,['#3c2466','#4b2a7b']);
const winNear=makeCity(99,14,310,128,28,70,['#1c2b5e','#231733','#10183a']);
const extFar=makeCity(3,-10,330,180,60,130,['#3c2466','#4b2a7b']);
const extNear=makeCity(4,-10,330,190,40,90,['#1c2b5e','#10183a']);

let parts=[];
function addPuff(x,y,col,vx,vy,r,life){ parts.push({x,y,vx,vy,r,life,max:life,col}); }
function stepParts(dt){ parts=parts.filter(p=>(p.life-=dt)>0); for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy-=3*dt; p.r+=dt*4; } }
function drawParts(){ for(const p of parts){ g.globalAlpha=clamp(p.life/p.max,0,1)*.9; E(p.x,p.y,p.r,p.r*.85,p.col,0); } g.globalAlpha=1; }

function building(b,base,boom,dt){
  let sink=0, rot=0, lit=true;
  if(boom>=0 && b.target){ const tb=boom-b.delay;
    if(tb>0){ lit=tb<.25; sink=Math.min(b.h+10,tb*tb*16); rot=b.dir*Math.min(.12,tb*.03);
      if(tb<1.6 && dt>0){ for(let k=0;k<2;k++) addPuff(b.x+Math.random()*b.w,base-2,Math.random()<.35?'#8d88a8':'#5a5670',(Math.random()-.5)*16,-4-Math.random()*8,2+Math.random()*3,2.5+Math.random()*2); }
    } }
  g.save(); g.beginPath(); g.rect(-50,-400,W+100,base+400); g.clip();
  g.translate(b.x+b.w/2,base+sink); g.rotate(rot); g.translate(-(b.x+b.w/2),-base);
  const x=b.x,w=b.w,h=b.h,l=b.lean,top=base-h;
  let d=`M${x} ${base} L${x+l} ${top} `;
  if(b.roof===1) d+=`L${x+l+w/2} ${top-w*.45} `;
  if(b.roof===2) d+=`Q${x+l+w/2} ${top-w*.7} `;
  d+=`L${x+w+l} ${top} L${x+w} ${base}Z`;
  fillP(d,b.col,1);
  line([x+w-1.5,base,x+w+l-1.5,top],'rgba(255,255,255,.08)',1.5);
  if(b.roof===0){ line([x+l+w*.3,top,x+l+w*.3,top-10],OL,1); if(((performance.now()/600)|0)%2) E(x+l+w*.3,top-10,1,1,'#ff5a4a',0); }
  for(const wn of b.win){ const yy=base-wn[1], xo=l*(wn[1]/h); g.fillStyle=lit&&wn[2]?'#ffe98a':'#10183a'; g.fillRect(x+xo+wn[0],yy-3,2.2,3); }
  g.restore();
  if(boom>=0 && b.target){ const tb=boom-b.delay;
    if(tb>0 && tb<1.4){ const r=4+tb*16; g.globalAlpha=1-tb/1.4;
      E(x+w/2,base-3,r*1.3,r*.8,'#d66a1a',0); E(x+w/2,base-5,r,r*.6,'#f5a02a',0); E(x+w/2,base-6,r*.6,r*.4,'#ffe98a',0); g.globalAlpha=1; } }
}
function sky(y0,y1,stops){ const gr=g.createLinearGradient(0,y0,0,y1); stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c)); g.fillStyle=gr; g.fillRect(0,y0,W,y1-y0); }
function stars(seed,y0,y1,t){ const R=rng(seed); for(let i=0;i<70;i++){ const x=R()*W, y=y0+R()*(y1-y0), tw=R(); g.fillStyle=(Math.sin(t*3+tw*9)>.2)?'#fff6e0':'#9b6fd1'; g.fillRect(x,y,1,1); } }

/* =========================================================
   Player
   ========================================================= */
const ticks=document.getElementById('ticks'), playBtn=document.getElementById('play');
let idx=0, playing=true, el=0, last=performance.now(), lastFrame=-1;
scenes.forEach((s,i)=>{ const d=document.createElement('div'); d.innerHTML='<span></span>'; d.onclick=e=>{e.stopPropagation(); go(i);}; ticks.appendChild(d); });
function go(i){ idx=(i+scenes.length)%scenes.length; el=0; lastFrame=-1; parts=[]; scenes[idx].init&&scenes[idx].init(); }
function setPlaying(p){ playing=p; playBtn.textContent=p?'⏸':'▶'; playBtn.setAttribute('aria-label',p?'Pause':'Abspielen'); }
const FPS=15;
function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(playing){ el+=dt; if(el>=scenes[idx].dur) go(idx+1); }
  const f=Math.floor(el*FPS);
  if(f!==lastFrame){
    const step=lastFrame<0?0:(f-lastFrame)/FPS; lastFrame=f;
    g=bctx; CS=1; g.setTransform(1,0,0,1,0,0); g.globalAlpha=1; g.clearRect(0,0,W,H);
    scenes[idx].draw(f/FPS, playing?step:0);
    if(el<.3){ g.setTransform(1,0,0,1,0,0); g.globalAlpha=1-el/.3; g.fillStyle='#000'; g.fillRect(0,0,W,H); g.globalAlpha=1; }
    present();
  }
  [...ticks.children].forEach((d,i)=>d.firstChild.style.width=(i<idx?100:i>idx?0:Math.min(100,el/scenes[idx].dur*100))+'%');
  requestAnimationFrame(loop);
}
document.getElementById('tv').onclick=()=>setPlaying(!playing);
playBtn.onclick=()=>setPlaying(!playing);
document.getElementById('next').onclick=()=>go(idx+1);
document.getElementById('prev').onclick=()=>go(idx-1);
